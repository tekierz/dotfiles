version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - dogsled
    - dupl
    - errorlint
    - exhaustive
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - goprintffuncname
    - gosec
    - misspell
    - nakedret
    - nilerr
    # noctx intentionally NOT enabled: every call site is a short-lived,
    # synchronous os/exec of a package manager (brew/apt/pacman) or local
    # tool. There is no HTTP usage, and interactive install cancellation is
    # tracked as a separate deferred feature (tasks/todo.md). Wrapping these
    # in context.Background() would be cargo-cult with no behavioral benefit.
    - nolintlint
    - prealloc
    - predeclared
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tparallel
    - unconvert
    - unparam
    - whitespace
  settings:
    dupl:
      threshold: 150
    gocognit:
      min-complexity: 30
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 20
    gosec:
      excludes:
        - G104  # Errors not checked: too noisy for a TUI (kept from v1 config)
        - G304  # File path as taint input: expected for a dotfiles manager
        - G204  # Subprocess with computed args: inherent to a package manager;
                # brew/apt/pacman are invoked with tool names from a controlled
                # registry, never arbitrary user input.
    misspell:
      locale: US
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - dupl
          - gocognit
          - gocyclo
        path: _test\.go
      - linters:
          - gosec
        path: _test\.go  # Test fixtures legitimately write world-readable
                         # files (0644) and run helper subprocesses; gosec
                         # G306/G204 are not meaningful for test scaffolding.
      - linters:
          - forbidigo
        path: cmd/
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
