version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    # Default linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    # Additional linters
    - bodyclose
    - errorlint
    - exhaustive
    - goprintffuncname
    - gosec
    - nakedret
    - nilerr
    - noctx
    - nolintlint
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - whitespace

  settings:
    staticcheck:
      # Optional formatting quick-fix introduced by the linter upgrade; keep
      # security and correctness checks unchanged. Standalone staticcheck also runs.
      checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-QF1012"]
    revive:
      rules:
        - name: exported
          disabled: true  # Allow unexported return types

  exclusions:
    rules:
      # Unix Stat_t field widths differ between Darwin and Linux. These exact
      # field conversions keep shared code compiling on both platforms.
      - path: internal/(pkg/executable_identity|safefile/(anchored_unix|directory_unix|parent_chain_unix|replace_unix))\.go
        linters: [unconvert]
        text: "unnecessary conversion"
        source: 'u?int(32|64)\([[:alnum:]_]+\.(Dev|Mode|Nlink)\)'
      # Test fixtures intentionally execute discovered local binaries and read
      # temporary paths. Production subprocess/path findings remain blocking.
      - path: _test\.go
        linters:
          - gosec

      # These readers consume paths derived from validated config names below
      # HOME/XDG roots. Traversal, symlink, and atomic-write boundaries have
      # dedicated regression tests in internal/config.
      - path: internal/config/(config|hotkeys|user)\.go
        linters:
          - gosec
        text: "G304:"

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
