name: Feature request
description: Propose a focused product improvement
title: "Feature: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should the project solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the user-visible result, not only an implementation.
    validations:
      required: true
  - type: dropdown
    id: platforms
    attributes:
      label: Primary platform
      options:
        - All supported platforms
        - macOS
        - Arch or Arch-based Linux
        - Debian or Debian-based Linux
        - Raspberry Pi OS
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: risks
    attributes:
      label: Safety and compatibility considerations
      description: Note package-manager, privilege, config migration, rollback, or privacy implications.
