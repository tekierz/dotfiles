name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Code is not formatted. Run 'gofmt -w .'"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        # Advisory: pinned to v2.5.0 (golangci-lint supports Go 1.25 since
        # v2.4.0). Flip to blocking once it has run clean against the project's
        # Go version for a few cycles. internal/ui is excluded from gocyclo/dupl
        # in .golangci.yml (large switch-based View/Update funcs) — revisit.
        continue-on-error: true
        with:
          version: v2.5.0
          args: --timeout=5m

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        # Advisory: kept at `latest` — no tagged staticcheck release is built
        # with / confirmed against Go 1.25 yet (2025.1.x is built with Go 1.24
        # and has known Go 1.25 compatibility issues, dominikh/go-tools#1674).
        # Pin to an exact tag and flip to blocking once a Go 1.25 release ships.
        continue-on-error: true
        with:
          version: latest
          install-go: false

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        # Advisory: pinned to v1.1.4 (latest tagged x/vuln release; compiles
        # against the Go 1.25 toolchain installed by setup-go). Flip to blocking
        # once it has run clean against the project's Go version for a few cycles.
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        run: go test -race ./...

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -o bin/dotfiles ./cmd/dotfiles

      - name: Verify binary runs
        run: ./bin/dotfiles --help
