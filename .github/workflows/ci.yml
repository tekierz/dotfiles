name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 branch, verified 2026-07-10

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6 branch, verified 2026-07-10
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check module files are tidy
        run: go mod tidy -diff

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Code is not formatted. Run 'gofmt -w .'"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.5.0
          golangci-lint run --timeout=5m

      - name: Validate release configuration
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.17.0
          goreleaser check

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Run ShellCheck
        run: shellcheck scripts/install-hooks.sh

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 branch, verified 2026-07-10

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6 branch, verified 2026-07-10
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 branch, verified 2026-07-10

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6 branch, verified 2026-07-10
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        run: go test -race ./...

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4 branch, verified 2026-07-10

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6 branch, verified 2026-07-10
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -o bin/dotfiles ./cmd/dotfiles

      - name: Verify binary runs
        run: ./bin/dotfiles --help
