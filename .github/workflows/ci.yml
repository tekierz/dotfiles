name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "::error::Code is not formatted. Run 'gofmt -w .'"
            gofmt -l .
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run golangci-lint
        # v7 of the action is required for golangci-lint v2.x (v4 targets v1.x).
        uses: golangci/golangci-lint-action@v7
        # Blocking. Config is v2 schema (.golangci.yml). The whole project,
        # including internal/ui, is enforced for gocognit/gocyclo/dupl — the
        # former internal/ui exclusion was removed and those functions refactored.
        with:
          version: v2.5.0
          args: --timeout=5m

      - name: Run staticcheck
        uses: dominikh/staticcheck-action@v1
        # Blocking, so pin to an exact release (NOT `latest`) — a floating
        # `latest` under a blocking gate can break an unrelated PR when upstream
        # ships a new release. 2026.1 (v0.7.0) supports the Go 1.25/1.26
        # toolchains and runs clean here; bump deliberately. (golangci-lint also
        # runs staticcheck; the standalone action surfaces ST/SA directly.)
        with:
          version: "2026.1"
          install-go: false

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        # Blocking. Pinned to v1.1.4 (latest tagged x/vuln release). Runs against
        # the Go toolchain in go.mod, which is pinned to >= 1.25.8: 1.25.x before
        # 1.25.8 has a reachable os.ReadDir vuln (GO-2026-4602), so lowering the
        # go.mod floor below 1.25.8 will (correctly) fail this gate.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Run tests
        run: go test ./...

      - name: Run tests with race detector
        run: go test -race ./...

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go build -o bin/dotfiles ./cmd/dotfiles

      - name: Verify binary runs
        run: ./bin/dotfiles --help
